<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="mau: your personal library and reading log">
  <!-- The README header: the landing page's logo, name (Pinyon Script, as
       outlines so it needs no font), and tagline. Made from web/static/logo.svg. -->
  <defs>
    <radialGradient id="bannerBg" cx="50%" cy="0%" r="95%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#1E242B" />
      <stop offset="60%" stop-color="#12161A" />
    </radialGradient>
    <filter id="badgeShadow" x="-40%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>
  <rect width="720" height="520" rx="28" fill="url(#bannerBg)" />
  <g filter="url(#badgeShadow)">
    <rect x="260" y="44" width="200" height="200" rx="45" fill="#12161A" />
  </g>
  <svg x="260" y="44" width="200" height="200" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E242B" />
      <stop offset="100%" stop-color="#12161A" />
    </linearGradient>

    <!-- Snow/Silver Bengal Coat (Left Cat) -->
    <linearGradient id="snowCoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6DFD5" />
      <stop offset="100%" stop-color="#C7B9A8" />
    </linearGradient>

    <!-- Warm Brown Bengal Coat (Right Cat) -->
    <linearGradient id="brownCoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D89448" />
      <stop offset="100%" stop-color="#A86826" />
    </linearGradient>

    <!-- Book Page Gradient -->
    <linearGradient id="pageGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7F3EB" />
      <stop offset="85%" stop-color="#EFE9DC" />
      <stop offset="100%" stop-color="#D5CBB8" />
    </linearGradient>
    <linearGradient id="pageGradR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F7F3EB" />
      <stop offset="85%" stop-color="#EFE9DC" />
      <stop offset="100%" stop-color="#D5CBB8" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="pawShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Badge Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="105" fill="none" stroke="#D89448" stroke-width="2" stroke-opacity="0.25" />

  <!-- Decorative Intertwined Striped Tails (Top) -->
  <g fill="none" stroke-linecap="round">
    <!-- Snow Bengal Tail -->
    <path d="M 135 160 C 95 95, 195 50, 255 85 C 295 108, 325 75, 305 45" stroke="#C7B9A8" stroke-width="18" />
    <path d="M 118 118 C 126 112, 134 118, 138 124 M 155 83 C 162 82, 168 90, 168 97 M 205 71 C 210 74, 212 84, 208 90 M 305 45 C 312 52, 308 62, 298 64" stroke="#3A322D" stroke-width="8" />
    <circle cx="305" cy="45" r="9" fill="#2A2421" />
  </g>

  <!-- ==================== LEFT CAT: SNOW / SILVER BENGAL ==================== -->
  <!-- Inspired by the wide-eyed "airplane ears" pose -->
  <g id="snow-bengal" filter="url(#shadow)">
    <!-- Neck/Shoulders -->
    <path d="M 105 235 Q 95 280 110 315 L 225 315 Q 235 280 225 235 Z" fill="url(#snowCoat)" />
    <!-- Chest Necklace Stripes -->
    <path d="M 115 268 Q 165 292 215 268" fill="none" stroke="#4A3F37" stroke-width="6" stroke-linecap="round" opacity="0.75" />
    <path d="M 122 288 Q 165 308 208 288" fill="none" stroke="#4A3F37" stroke-width="5" stroke-linecap="round" opacity="0.65" />

    <!-- Airplane Ears (Angled sharply outward) -->
    <!-- Left Ear -->
    <path d="M 112 182 L 52 136 C 58 175, 78 202, 102 212 Z" fill="url(#snowCoat)" stroke="#3A322D" stroke-width="4" stroke-linejoin="round" />
    <path d="M 104 184 L 66 150 C 72 174, 85 192, 98 200 Z" fill="#C9968B" opacity="0.7" />
    <!-- Right Ear -->
    <path d="M 218 182 L 278 136 C 272 175, 252 202, 228 212 Z" fill="url(#snowCoat)" stroke="#3A322D" stroke-width="4" stroke-linejoin="round" />
    <path d="M 226 184 L 264 150 C 258 174, 245 192, 232 200 Z" fill="#C9968B" opacity="0.7" />

    <!-- Head -->
    <ellipse cx="165" cy="205" rx="64" ry="54" fill="url(#snowCoat)" />

    <!-- Classic Bengal "M" Forehead & Cheek Markings -->
    <path d="M 138 176 L 148 156 L 165 174 L 182 156 L 192 176" fill="none" stroke="#3A322D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 152 154 L 156 138 M 178 154 L 174 138" fill="none" stroke="#3A322D" stroke-width="4" stroke-linecap="round" />
    <!-- Cheek Stripes -->
    <path d="M 104 205 Q 118 208 126 216 M 106 220 Q 120 222 130 228" fill="none" stroke="#3A322D" stroke-width="4" stroke-linecap="round" />
    <path d="M 226 205 Q 212 208 204 216 M 224 220 Q 210 222 200 228" fill="none" stroke="#3A322D" stroke-width="4" stroke-linecap="round" />

    <!-- Wide Owl-Like Dark Eyes -->
    <circle cx="137" cy="200" r="17" fill="#4E594A" stroke="#221D1A" stroke-width="3.5" />
    <circle cx="137" cy="200" r="13.5" fill="#14110F" />
    <circle cx="132" cy="194" r="4.5" fill="#FFFFFF" />
    <circle cx="143" cy="205" r="2" fill="#FFFFFF" opacity="0.8" />

    <circle cx="193" cy="200" r="17" fill="#4E594A" stroke="#221D1A" stroke-width="3.5" />
    <circle cx="193" cy="200" r="13.5" fill="#14110F" />
    <circle cx="188" cy="194" r="4.5" fill="#FFFFFF" />
    <circle cx="199" cy="205" r="2" fill="#FFFFFF" opacity="0.8" />

    <!-- Nose Bridge Shading & Muzzle -->
    <path d="M 156 190 Q 165 215 174 190" fill="#8C7765" opacity="0.45" />
    <ellipse cx="153" cy="233" rx="16" ry="11" fill="#F5EFE6" />
    <ellipse cx="177" cy="233" rx="16" ry="11" fill="#F5EFE6" />
    <!-- Whisker Dots -->
    <circle cx="144" cy="231" r="1.8" fill="#2A2421" />
    <circle cx="139" cy="235" r="1.8" fill="#2A2421" />
    <circle cx="147" cy="237" r="1.8" fill="#2A2421" />
    <circle cx="186" cy="231" r="1.8" fill="#2A2421" />
    <circle cx="191" cy="235" r="1.8" fill="#2A2421" />
    <circle cx="183" cy="237" r="1.8" fill="#2A2421" />

    <!-- Brick-Pink Nose & Mouth -->
    <polygon points="155,220 175,220 165,231" fill="#C86D58" stroke="#2A2421" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 165 231 L 165 237 M 165 237 Q 155 244 146 239 M 165 237 Q 175 244 184 239" fill="none" stroke="#2A2421" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- ==================== RIGHT CAT: WARM BROWN BENGAL ==================== -->
  <!-- Inspired by the tall-eared head-tilt pose & rich rosettes -->
  <g id="brown-bengal" filter="url(#shadow)" transform="rotate(-7, 345, 215)">
    <!-- Neck/Shoulders with Rosettes -->
    <path d="M 280 230 Q 270 280 285 320 L 405 320 Q 415 280 400 230 Z" fill="url(#brownCoat)" />
    <!-- Bengal Rosettes & Stripes on Body -->
    <circle cx="315" cy="275" r="9" fill="#6E3B10" stroke="#1E140C" stroke-width="4" stroke-dasharray="18 8" />
    <circle cx="368" cy="280" r="10" fill="#6E3B10" stroke="#1E140C" stroke-width="4" stroke-dasharray="20 9" />
    <circle cx="342" cy="298" r="8" fill="#6E3B10" stroke="#1E140C" stroke-width="3.5" stroke-dasharray="16 7" />
    <path d="M 292 252 Q 340 275 388 252" fill="none" stroke="#1E140C" stroke-width="6" stroke-linecap="round" />

    <!-- Tall Alert Rounded Ears -->
    <!-- Left Ear -->
    <path d="M 288 175 C 275 115, 292 88, 315 100 C 328 108, 335 135, 336 160 Z" fill="url(#brownCoat)" stroke="#1E140C" stroke-width="4" stroke-linejoin="round" />
    <path d="M 296 166 C 287 125, 298 104, 313 112 C 322 118, 327 138, 328 158 Z" fill="#D98A7C" opacity="0.75" />
    <!-- Right Ear -->
    <path d="M 392 175 C 405 115, 388 88, 365 100 C 352 108, 345 135, 344 160 Z" fill="url(#brownCoat)" stroke="#1E140C" stroke-width="4" stroke-linejoin="round" />
    <path d="M 384 166 C 393 125, 382 104, 367 112 C 358 118, 353 138, 352 158 Z" fill="#D98A7C" opacity="0.75" />

    <!-- Head -->
    <ellipse cx="340" cy="202" rx="62" ry="53" fill="url(#brownCoat)" />

    <!-- Forehead Markings & Mascara Stripes -->
    <path d="M 314 172 L 324 152 L 340 170 L 356 152 L 366 172" fill="none" stroke="#1E140C" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 328 150 L 332 132 M 352 150 L 348 132" fill="none" stroke="#1E140C" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 280 202 Q 296 205 304 214 M 282 217 Q 298 220 308 226" fill="none" stroke="#1E140C" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 400 202 Q 384 205 376 214 M 398 217 Q 382 220 372 226" fill="none" stroke="#1E140C" stroke-width="4.5" stroke-linecap="round" />

    <!-- Expressive Greenish-Gold Eyes -->
    <ellipse cx="313" cy="198" rx="15.5" ry="14.5" fill="#6D8C49" stroke="#1E140C" stroke-width="3.5" />
    <ellipse cx="313" cy="198" rx="9" ry="12" fill="#14110F" />
    <circle cx="308" cy="192" r="4" fill="#FFFFFF" />

    <ellipse cx="367" cy="198" rx="15.5" ry="14.5" fill="#6D8C49" stroke="#1E140C" stroke-width="3.5" />
    <ellipse cx="367" cy="198" rx="9" ry="12" fill="#14110F" />
    <circle cx="362" cy="192" r="4" fill="#FFFFFF" />

    <!-- Cream Muzzle Pads -->
    <ellipse cx="328" cy="230" rx="16" ry="11" fill="#F2DEC4" />
    <ellipse cx="352" cy="230" rx="16" ry="11" fill="#F2DEC4" />
    <circle cx="319" cy="228" r="1.8" fill="#1E140C" />
    <circle cx="314" cy="232" r="1.8" fill="#1E140C" />
    <circle cx="361" cy="228" r="1.8" fill="#1E140C" />
    <circle cx="366" cy="232" r="1.8" fill="#1E140C" />

    <!-- Terracotta Nose & Sweet Tilted Smile -->
    <polygon points="330,217 350,217 340,228" fill="#B85642" stroke="#1E140C" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 340 228 L 340 234 M 340 234 Q 330 241 321 236 M 340 234 Q 350 241 359 236" fill="none" stroke="#1E140C" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- ==================== OPEN BOOK ==================== -->
  <g id="open-book" filter="url(#shadow)">
    <!-- Hardcover Backing -->
    <path d="M 48 312 Q 152 292 256 326 Q 360 292 464 312 L 476 436 Q 366 414 256 448 Q 146 414 36 436 Z" fill="#8C3B2B" stroke="#5E2317" stroke-width="4" stroke-linejoin="round" />
    <!-- Gold Ribbon Bookmark -->
    <path d="M 256 442 Q 248 472 232 490 L 250 486 L 260 496 Q 266 470 256 442 Z" fill="#E5A93C" />

    <!-- Bottom Page Stack Accent -->
    <path d="M 56 302 Q 156 280 256 318 Q 356 280 456 302 L 464 422 Q 360 398 256 434 Q 152 398 48 422 Z" fill="#D5CBB8" stroke="#AFA38E" stroke-width="2" />

    <!-- Left Page -->
    <path d="M 60 290 Q 158 266 256 308 L 256 426 Q 156 386 52 408 Z" fill="url(#pageGradL)" />
    <!-- Right Page -->
    <path d="M 452 290 Q 354 266 256 308 L 256 426 Q 356 386 460 408 Z" fill="url(#pageGradR)" />

    <!-- Center Spine Crease -->
    <line x1="256" y1="308" x2="256" y2="426" stroke="#B8AC97" stroke-width="3" stroke-linecap="round" />

    <!-- Subtle Decorative Book Lines on Left Page -->
    <path d="M 95 335 Q 155 322 215 342" fill="none" stroke="#C7BBA6" stroke-width="3" stroke-linecap="round" />
    <path d="M 92 355 Q 155 342 215 362" fill="none" stroke="#C7BBA6" stroke-width="3" stroke-linecap="round" />
    <path d="M 90 375 Q 135 366 180 378" fill="none" stroke="#C7BBA6" stroke-width="3" stroke-linecap="round" />

    <!-- Subtle Decorative Book Lines on Right Page -->
    <path d="M 297 342 Q 357 322 417 335" fill="none" stroke="#C7BBA6" stroke-width="3" stroke-linecap="round" />
    <path d="M 297 362 Q 357 342 420 355" fill="none" stroke="#C7BBA6" stroke-width="3" stroke-linecap="round" />
    <path d="M 297 382 Q 342 368 387 375" fill="none" stroke="#C7BBA6" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- ==================== STRIPED BENGAL PAWS DRAPED OVER BOOK ==================== -->
  <!-- Inspired by the outstretched striped forelegs in Photos 1 & 3 -->
  <g id="paws" filter="url(#pawShadow)">
    <!-- Snow Bengal Left Paw -->
    <g transform="translate(92, 272) rotate(12)">
      <rect x="0" y="0" width="38" height="62" rx="19" fill="url(#snowCoat)" stroke="#3A322D" stroke-width="3" />
      <!-- Leg Stripes -->
      <path d="M 4 16 Q 19 22 34 16 M 3 29 Q 19 35 35 29 M 5 41 Q 19 46 33 41" fill="none" stroke="#3A322D" stroke-width="4.5" stroke-linecap="round" />
      <!-- Toe Separations -->
      <path d="M 13 50 L 13 60 M 25 50 L 25 60" stroke="#3A322D" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Snow Bengal Right Paw -->
    <g transform="translate(188, 278) rotate(-8)">
      <rect x="0" y="0" width="38" height="64" rx="19" fill="url(#snowCoat)" stroke="#3A322D" stroke-width="3" />
      <path d="M 4 16 Q 19 22 34 16 M 3 29 Q 19 35 35 29 M 5 42 Q 19 47 33 42" fill="none" stroke="#3A322D" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 13 52 L 13 62 M 25 52 L 25 62" stroke="#3A322D" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Brown Bengal Left Paw -->
    <g transform="translate(278, 278) rotate(8)">
      <rect x="0" y="0" width="38" height="60" rx="19" fill="url(#brownCoat)" stroke="#1E140C" stroke-width="3" />
      <path d="M 4 15 Q 19 21 34 15 M 3 28 Q 19 34 35 28 M 5 40 Q 19 45 33 40" fill="none" stroke="#1E140C" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 13 49 L 13 58 M 25 49 L 25 58" stroke="#1E140C" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Brown Bengal Right Paw -->
    <g transform="translate(385, 270) rotate(-14)">
      <rect x="0" y="0" width="38" height="62" rx="19" fill="url(#brownCoat)" stroke="#1E140C" stroke-width="3" />
      <path d="M 4 16 Q 19 22 34 16 M 3 29 Q 19 35 35 29 M 5 41 Q 19 46 33 41" fill="none" stroke="#1E140C" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 13 50 L 13 60 M 25 50 L 25 60" stroke="#1E140C" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
