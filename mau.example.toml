# mau configuration. Copy to /etc/mau/mau.toml (or pass --config).
# Any key can be overridden with an environment variable: MAU_LISTEN,
# MAU_PUBLIC_URL, MAU_DATA_DIR, MAU_TRUSTED_PROXIES (comma-separated).

# Plain HTTP address mau listens on. Put a reverse proxy in front for HTTPS.
listen = "127.0.0.1:8370"

# The address people use to reach mau. It's used in setup, invite, and reset
# links, and names the instance in authenticator apps.
public_url = "https://books.example.com"

# Database, covers, and backups live here.
data_dir = "/var/lib/mau"

# Reverse proxies whose X-Forwarded-For / X-Forwarded-Proto headers are trusted.
trusted_proxies = ["127.0.0.1", "::1"]

# Daily database snapshots kept in <data_dir>/backups (0 turns them off).
# Cover images are plain files in <data_dir>/covers; include them in your own backups.
backup_keep = 7
