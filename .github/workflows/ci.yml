# Tests every push and pull request, and main every Monday (so new advisories
# show up between pushes). A push to main that passes is built as a static
# binary and deployed to maubooks.org (see deploy/README.md).
#
# Third-party actions are pinned to commits; the comment names the release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes to main each get
# their own run (the deploy job keeps them in order).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new Rust release's lints don't fail a deploy unannounced.
  RUST_VERSION: 1.96.0
  NODE_VERSION: 26
  TARGET: x86_64-unknown-linux-musl

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A failing run still compiled the dependencies; keep them.
          cache-on-failure: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Build the web app
        run: npm run build
        working-directory: web
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Generated API types are committed
        run: |
          changes=$(git status --porcelain -- web/src/lib/api/generated)
          if [ -n "$changes" ]; then
            echo "cargo test changed the API types; commit them:"
            echo "$changes"
            exit 1
          fi
      - name: Web type check
        run: npm run check
        working-directory: web
      - name: Web formatting
        run: npm run lint
        working-directory: web
      - name: Web tests
        run: npx vitest --run
        working-directory: web
      - name: Build the server for end-to-end tests
        run: cargo build -p mau-server --locked
      # Headless tests need only Chromium's headless shell. The browser is
      # cached per Playwright version; its system libraries are installed
      # every run (they're not in the cache).
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Install the browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
        working-directory: web
      - name: Install the browser's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: web
      - name: End-to-end tests
        run: npx playwright test --reporter=github,list
        working-directory: web

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      # RUSTSEC-2026-0459 (SQLite) is fixed in libsqlite3-sys 0.39, which sqlx
      # doesn't allow yet. Any other advisory fails the build.
      - name: Rust advisories
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0459
      # What ships: the web app's runtime dependencies (build tools aren't in
      # the binary).
      - name: npm advisories
        run: npm audit --omit=dev
        working-directory: web

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A failing run still compiled the dependencies; keep them.
          cache-on-failure: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the web app
        run: npm ci && npm run build
        working-directory: web
      - name: Build the static binary
        run: cargo build --release --locked --target "$TARGET" -p mau-server
        env:
          # Reported by /api/health, so the deploy can check what's live.
          MAU_COMMIT: ${{ github.sha }}
      - name: Check that it's static and runs
        run: |
          bin=target/$TARGET/release/mau
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked'
          "$bin" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mau-${{ env.TARGET }}
          path: target/${{ env.TARGET }}/release/mau
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: [test, audit, build]
    # Pushes and manual runs only: the weekly run checks, it doesn't deploy.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://maubooks.org
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 100.82.93.4
    steps:
      - name: Still the newest commit on main
        id: newest
        run: |
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $head; its own run deploys it."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.newest.outputs.deploy
        with:
          name: mau-${{ env.TARGET }}
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        if: steps.newest.outputs.deploy
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Install on the server
        if: steps.newest.outputs.deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          sha=$(sha256sum mau | cut -d' ' -f1)
          # Compressed in transit: the binary shrinks to under half.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o Compression=yes "deploy@$DEPLOY_HOST" "$sha $GITHUB_SHA" < mau
      # Through the proxy, from outside, and answering as the new commit.
      - name: Check https://maubooks.org
        if: steps.newest.outputs.deploy
        run: |
          health=$(curl -fsS --retry 5 --retry-all-errors https://maubooks.org/api/health)
          echo "$health"
          echo "$health" | jq -e --arg c "$GITHUB_SHA" '.status == "ok" and .commit == $c' >/dev/null
