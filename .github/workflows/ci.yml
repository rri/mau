# Tests every push and pull request. A push to main that passes is built as a
# static binary and deployed to maubooks.org (see deploy/README.md).
#
# Third-party actions are pinned to commits; the comment names the release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new Rust release's lints don't fail a deploy unannounced.
  RUST_VERSION: 1.96.0
  NODE_VERSION: 26
  TARGET: x86_64-unknown-linux-musl

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Build the web app
        run: npm run build
        working-directory: web
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Generated API types are committed
        run: |
          changes=$(git status --porcelain -- web/src/lib/api/generated)
          if [ -n "$changes" ]; then
            echo "cargo test changed the API types; commit them:"
            echo "$changes"
            exit 1
          fi
      - name: Web type check
        run: npm run check
        working-directory: web
      - name: Web formatting
        run: npm run lint
        working-directory: web
      - name: Web tests
        run: npx vitest --run
        working-directory: web
      - name: End-to-end tests
        run: |
          cargo build -p mau-server --locked
          npx playwright install --with-deps chromium
          npx playwright test
        working-directory: web

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      # RUSTSEC-2026-0459 (SQLite) is fixed in libsqlite3-sys 0.39, which sqlx
      # doesn't allow yet. Any other advisory fails the build.
      - name: Advisories
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0459

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the web app
        run: npm ci && npm run build
        working-directory: web
      - name: Build the static binary
        run: cargo build --release --locked --target "$TARGET" -p mau-server
      - name: Check that it's static and runs
        run: |
          bin=target/$TARGET/release/mau
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked'
          "$bin" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mau-${{ env.TARGET }}
          path: target/${{ env.TARGET }}/release/mau
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: [test, audit, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://maubooks.org
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 100.82.93.4
    steps:
      - name: Still the newest commit on main
        id: newest
        run: |
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $head; its own run deploys it."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.newest.outputs.deploy
        with:
          name: mau-${{ env.TARGET }}
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        if: steps.newest.outputs.deploy
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Install on the server
        if: steps.newest.outputs.deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          sha=$(sha256sum mau | cut -d' ' -f1)
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 "deploy@$DEPLOY_HOST" "$sha $GITHUB_SHA" < mau
      - name: Check https://maubooks.org
        if: steps.newest.outputs.deploy
        run: curl -fsS --retry 5 --retry-all-errors https://maubooks.org/api/health
