[workspace]
resolver = "3"
members = ["crates/mau-core", "crates/mau-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
axum = "0.8"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
csv = "1"
clap = { version = "4", features = ["derive", "env"] }
maud = "0.27"
hmac = "0.13"
data-encoding = "2"
mime_guess = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "http2"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "11"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Password and recovery-code hashing (argon2) is ~10x slower unoptimized; a
# sign-up hashes 11 times, which outlasts end-to-end test timeouts in CI.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
